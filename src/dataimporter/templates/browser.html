<!DOCTYPE html>
<html lang="en" data-base="{{ base_path }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dataimporter</title>
<link rel="stylesheet" href="{{ base_path }}/static/browser.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js" crossorigin="anonymous"></script>
</head>
<body>
<h1>dataimporter</h1>

<div class="card" id="authCard">
  <div class="row">
    <div><label>Public Key</label><input type="text" id="pk" placeholder="pk-..."></div>
    <div><label>Secret Key</label><input type="text" id="sk" placeholder="sk-..."></div>
  </div>
</div>

<!-- Datasource tabs -->
<div class="ds-tabs" id="dsTabs"></div>

<!-- Filters (shown when a datasource is selected) -->
<div class="card" id="filtersCard" style="display:none">
  <div class="search-row">
    <!-- Time group: field selector + range picker on one line -->
    <div class="time-group">
      <div class="time-group-header">
        <label style="margin:0">Range</label>
        <select id="timeFieldSel" class="time-field-sel" title="Field used for time filtering"
                onchange="setTimeField(this.value)" style="display:none">
          <option value="">— off —</option>
        </select>
      </div>
      <div id="timePickerWrap">
        <div class="time-picker" id="timePicker">
          <button type="button" class="time-btn" onclick="toggleTimeDropdown()">
            <span id="timeLabel">Last 24 hours</span>
            <span class="arrow">&#9660;</span>
          </button>
          <div class="time-dropdown" id="timeDropdown">
            <div class="time-presets" id="timePresets">
              <div onclick="setPreset('15m','Last 15 minutes')">Last 15 minutes</div>
              <div onclick="setPreset('1h','Last 1 hour')">Last 1 hour</div>
              <div onclick="setPreset('4h','Last 4 hours')">Last 4 hours</div>
              <div class="active" onclick="setPreset('24h','Last 24 hours')">Last 24 hours</div>
              <div onclick="setPreset('7d','Last 7 days')">Last 7 days</div>
              <div onclick="setPreset('30d','Last 30 days')">Last 30 days</div>
              <div onclick="setPreset('all','All time')">All time</div>
            </div>
            <div class="time-custom">
              <label>From</label>
              <input type="datetime-local" id="time_from">
              <label>To</label>
              <input type="datetime-local" id="time_to">
              <button class="btn-primary btn-sm" onclick="applyCustomRange()">Apply</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Search input with info badge -->
    <div class="search-group">
      <label>Search <span id="searchInfoBadge" class="search-badge" style="display:none"></span></label>
      <input type="text" id="f_query" placeholder="Search inside content...">
    </div>
  </div>

  <!-- Backend filter builder (hidden for S3 file-list mode) -->
  <div id="filterToggleArea" style="display:none">
    <div class="samp-toggle" style="align-items:center">
      <button type="button" id="filter_toggle_btn" onclick="toggleFilters()">⚗ Add filters ▼</button>
      <div class="filter-mode-toggle" id="filter_mode_toggle" style="display:none">
        <button class="filter-mode-btn active" id="fm_and" onclick="_setFilterMode('and')">AND</button>
        <button class="filter-mode-btn" id="fm_or" onclick="_setFilterMode('or')">OR</button>
      </div>
    </div>
    <div id="filter_panel" class="samp-panel" style="display:none">
      <div id="filter_rules"></div>
      <div class="filter-add-row">
        <select id="filter_field_sel" style="flex:2;min-width:120px">
          <option value="">— field —</option>
        </select>
        <select id="filter_op_sel" onchange="_onFilterOpChange(this)">
          <option value="contains">contains</option>
          <option value="eq">equals</option>
          <option value="neq">not equals</option>
          <option value="not_contains">not contains</option>
          <option value="starts_with">starts with</option>
          <option value="in">in</option>
          <option value="not_in">not in</option>
          <option value="gt">&gt;</option>
          <option value="lt">&lt;</option>
          <option value="gte">&gt;=</option>
          <option value="lte">&lt;=</option>
          <option value="is_null">is empty</option>
          <option value="not_null">not empty</option>
        </select>
        <input type="text" id="filter_val_inp" placeholder="value…">
        <button class="btn-secondary btn-sm" onclick="addFilterRule()">+ Add</button>
      </div>
    </div>
  </div>

  <div class="actions" id="actionButtons"></div>
</div>

<div id="schemaBar" class="schema-bar" style="display:none"></div>
<div id="colPicker" class="col-picker" style="display:none"></div>

<div id="status"></div>

<div class="card" id="results" style="display:none">
  <table>
    <thead id="thead"></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="actions" id="resultActions"></div>
  <div id="urls"></div>
</div>

<!-- Export panel — always visible when a datasource is selected -->
<div class="card" id="exportCard" style="display:none">
  <div class="samp-toggle" style="margin-top:0">
    <button type="button" id="samp_btn" onclick="toggleSampling()">⚗ Sampling ▼</button>
  </div>
  <div id="samp_panel" class="samp-panel" style="display:none;margin-top:10px">
    <div id="samp_schema_area"><span style="color:#aaa;font-size:.78rem">Click to load schema</span></div>
    <div id="samp_options" style="display:none">
      <label class="samp-strict"><input type="checkbox" id="samp_strict"> Ignore traces with mismatched structure</label>
      <div class="samp-max"><label>Max traces</label><input type="number" id="samp_max_traces" placeholder="no limit" min="1" style="width:100px"></div>
      <div class="samp-rules" id="samp_rules"></div>
      <div class="samp-add-row">
        <select id="samp_strat_select"></select>
        <button class="btn-secondary btn-sm" onclick="addSampRule()">+ Add strategy</button>
      </div>
      <div id="samp_yield" class="samp-yield" style="display:none"></div>
    </div>
  </div>
  <div class="export-options">
    <label class="export-opt-label">
      <input type="checkbox" id="exp_col_mask" onchange="_expColMask=this.checked">
      <div class="export-opt-text">
        <span class="export-opt-title">Use column filter as dataset mask</span>
        <span class="export-opt-desc">Export only the fields currently visible in the table (from the column picker)</span>
      </div>
    </label>
    <!-- Masking rules builder -->
    <div class="mask-rules-section" id="mask_rules_section">
      <div style="font-size:.8rem;font-weight:600;color:#374151;margin-bottom:6px">Field masking rules</div>
      <div id="mask_rules"></div>
      <div class="mask-add-row">
        <input type="text" id="mask_field_inp" placeholder="field.path">
        <select id="mask_action_sel" onchange="_onMaskActionChange(this)">
          <option value="remove">remove</option>
          <option value="hash">hash</option>
          <option value="redact">redact</option>
          <option value="truncate">truncate</option>
          <option value="keep">keep</option>
        </select>
        <input type="number" id="mask_maxlen_inp" placeholder="max len" min="1" style="width:80px;display:none">
        <button class="btn-secondary btn-sm" onclick="addMaskRule()">+ Add</button>
      </div>
    </div>

    <label class="export-opt-label">
      <input type="checkbox" id="exp_asset_resolve" onchange="_expAssetResolve=this.checked;_toggleAssetPanel(this.checked)">
      <div class="export-opt-text">
        <span class="export-opt-title">Enable asset resolution</span>
        <span class="export-opt-desc">Find any referenced assets (images, files, URLs) and export them as a separate dataset</span>
      </div>
    </label>
    <!-- Asset resolution expanded options -->
    <div id="asset_panel" class="asset-panel" style="display:none">
      <div>
        <label>Source fields <span class="hint">(dot-notation paths that hold asset references)</span></label>
        <div class="asset-tag-list" id="asset_sources_list"></div>
        <div style="display:flex;gap:6px;margin-top:4px">
          <input type="text" id="asset_src_inp" placeholder="e.g. trace.attachments" style="flex:1;padding:5px 8px;border:1px solid #d1d5db;border-radius:4px;font-size:.82rem">
          <button class="btn-secondary btn-sm" onclick="_addAssetSource()">+ Add</button>
        </div>
      </div>
      <div>
        <label>Fetch mode</label>
        <select id="asset_fetch_mode" onchange="_assetFetchMode=this.value" style="width:100%;padding:5px 8px;border:1px solid #d1d5db;border-radius:4px;font-size:.82rem">
          <option value="metadata_only">metadata_only — record URL/size/mime only</option>
          <option value="full">full — download content into export</option>
        </select>
      </div>
      <div class="cfg-toggle">
        <input type="checkbox" id="asset_check_avail" onchange="_assetCheckAvail=this.checked">
        <label for="asset_check_avail" style="font-weight:400">HEAD-check each asset URL before including it</label>
      </div>
    </div>
  </div>

  <!-- Destination -->
  <div class="cfg-section" id="dest_section">
    <div class="cfg-section-title">Destination</div>
    <div class="cfg-field">
      <label>Target</label>
      <select id="dest_target" onchange="_destTarget=this.value">
        <option value="">— select target —</option>
      </select>
    </div>
    <div class="cfg-field">
      <label>Dataset name</label>
      <input type="text" id="dest_dataset_name" placeholder="my-export-2024" oninput="_destDatasetName=this.value">
    </div>
    <div style="display:flex;gap:10px">
      <div class="cfg-field" style="flex:1">
        <label>Access</label>
        <select id="dest_access" onchange="_destAccess=this.value">
          <option value="organization">organization</option>
          <option value="private">private</option>
        </select>
      </div>
      <div class="cfg-field" style="flex:1">
        <label>Dataset type</label>
        <select id="dest_dataset_type" onchange="_destDatasetType=this.value">
          <option value="DATASET">DATASET</option>
          <option value="EXPERIMENT">EXPERIMENT</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Webhook -->
  <div class="cfg-section">
    <div class="cfg-section-title">Webhook <span style="font-size:.72rem;font-weight:400;color:#9ca3af;text-transform:none;letter-spacing:0">— notified on job completion</span></div>
    <div class="cfg-field">
      <label>URL</label>
      <input type="text" id="webhook_url" placeholder="https://example.com/hooks/done" oninput="_webhookUrl=this.value">
    </div>
    <div class="cfg-field">
      <label>Headers <span class="hint">(key: value, one per line)</span></label>
      <textarea id="webhook_headers" rows="2" oninput="_webhookHeadersRaw=this.value"
        style="width:100%;padding:6px 8px;border:1px solid #d1d5db;border-radius:4px;font-size:.82rem;font-family:monospace;resize:vertical"
        placeholder="Authorization: Bearer token"></textarea>
    </div>
    <div style="display:flex;gap:10px">
      <div class="cfg-field" style="flex:1">
        <label>Secret <span class="hint">(HMAC signing)</span></label>
        <input type="text" id="webhook_secret" placeholder="optional" oninput="_webhookSecret=this.value">
      </div>
      <div class="cfg-field" style="width:110px">
        <label>Timeout (s)</label>
        <input type="number" id="webhook_timeout" value="30" min="1" max="300" oninput="_webhookTimeout=parseInt(this.value)||30">
      </div>
    </div>
  </div>

  <!-- Schedule -->
  <div class="cfg-section">
    <div class="cfg-section-title">Schedule</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <div class="cfg-field" style="flex:2;min-width:150px">
        <label>Cron expression</label>
        <input type="text" id="schedule_cron" placeholder="0 9 * * 1" oninput="_scheduleCron=this.value">
        <div class="hint">minute hour day month weekday</div>
      </div>
      <div class="cfg-field" style="flex:1;min-width:130px">
        <label>Timezone</label>
        <input type="text" id="schedule_tz" placeholder="UTC" value="UTC" oninput="_scheduleTz=this.value">
      </div>
    </div>
    <div class="cfg-toggle">
      <input type="checkbox" id="schedule_enabled" checked onchange="_scheduleEnabled=this.checked">
      <label for="schedule_enabled" style="font-weight:400">Enabled</label>
    </div>
  </div>

  <div class="actions">
    <button class="btn-secondary btn-sm" onclick="downloadConfigYaml()" title="Download current configuration as YAML">⬇ Config YAML</button>
    <label class="btn-secondary btn-sm" style="cursor:pointer;margin:0;display:inline-flex;align-items:center" title="Upload a saved configuration YAML">
      ⬆ Config YAML
      <input type="file" id="yamlFileInput" accept=".yaml,.yml" style="display:none" onchange="_onYamlFileSelected(this)">
    </label>
    <button class="btn-primary" onclick="showExportModal(_sampMode)">Export ▼</button>
  </div>
</div>

<div id="modal"></div>

<script src="{{ base_path }}/static/browser.js"></script>
</body>
</html>
