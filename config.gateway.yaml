datasources:
  - name: "S3 / MinIO"
    type: s3
    bucket: "llogr-raw-events"
    region: "us-east-1"
    endpoint: "http://minio:9000"
    public_endpoint: "http://localhost:8888/s3"
    access_key_id: "minioadmin"
    secret_access_key: "minioadmin"
    addressing_style: "path"

  - name: "ClickHouse"
    type: clickhouse
    url: "http://clickhouse:8123"
    database: "default"
    table: "llogr_events"
    user: "default"
    password: "clickhouse"

  - name: "Trino"
    type: trino
    url: "http://trino:8080"
    catalog: "hive"
    schema_name: "llm_logs"
    table: "llogr_events"
    user: "dataimporter"

  - name: "CHYT"
    type: chyt
    url: "http://chyt-proxy:8123"
    database: "*ch_public"        # CHYT clique alias
    table: "//home/user/llogr_events"  # full YT table path
    user: "yt"
    password: ""                  # YT OAuth token

  - name: "Langfuse"
    type: langfuse
    url: "http://langfuse-web:3000"
    access_key_id: "lf-pk-ai-suite"
    secret_access_key: "lf-sk-ai-suite"

connections:
  - type: langfuse
    url: "http://langfuse-web:3000"
    label: "Langfuse (own keys)"

  # Lock to a specific S3 endpoint — users supply only credentials + bucket/path
  - type: s3
    url: "http://minio:9000"
    label: "MinIO (own keys)"
    region: "us-east-1"
    addressing_style: "path"

  # Allow any S3-compatible endpoint — users supply endpoint + credentials + bucket/path
  - type: s3
    url: "*"
    label: "Custom S3"
    region: "us-east-1"
    addressing_style: "path"

targets:
  - name: "Mock Dataset Service"
    base_url: "http://dataset-mock:9100"
    token_url: "http://dataset-mock:9100/realms/test/protocol/openid-connect/token"
    client_id: "dataimporter"
    client_secret: "any"
    default_access: "organization"
    default_dataset_type: "DATASET"

server:
  root_path: "/dataimporter"
  hide_auth_inputs: true
  port: 5001
  workers: 2
  redis_url: "redis://langfuse-redis:6379/1"
